<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>실시간 통역 · 实时翻译</title>
<meta name="theme-color" content="#0b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg1:#0b1530; --bg2:#13244d; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12);
  --text:#f3f6ff; --muted:#9fb0d6; --gold:#ffc861; --red:#ff5a6a; --blue:#4f8cff; --green:#38d39f;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#1d1640);color:var(--text);
  font-family:Pretendard,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow-y:auto}
.screen.active{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin:10px 0 4px;letter-spacing:-.5px}
h2{font-size:20px;margin:6px 0 14px}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 22px}
.logo{font-size:44px;margin-top:20px}
.choices{display:flex;flex-direction:column;gap:14px}
.choice{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left;transition:.15s}
.choice:active{transform:scale(.98);background:rgba(255,255,255,.13)}
.choice .flag{font-size:40px}
.choice b{display:block;font-size:21px}
.choice span{color:var(--muted);font-size:14px}
.btn{padding:16px 20px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#ff9d5c);color:#2a1600;font-weight:800;font-size:18px;width:100%}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn:active{transform:scale(.98)}
.back{align-self:flex-start;color:var(--muted);padding:6px 0;font-size:15px}
.codebox{text-align:center;margin:10px 0 18px}
.code{font-size:64px;font-weight:900;letter-spacing:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.qr{background:#fff;border-radius:18px;padding:12px;width:210px;height:210px;margin:8px auto}
.qr svg{width:100%;height:100%}
.codeinput{font-size:44px;text-align:center;letter-spacing:14px;width:100%;padding:14px;border-radius:18px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--gold);font-weight:800;outline:none}
.codeinput:focus{border-color:var(--gold)}
.wait{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);margin:14px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.langrow{display:flex;gap:10px;margin-bottom:20px}
.langrow button{flex:1;padding:14px 6px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:16px}
.langrow button.on{border-color:var(--gold);background:rgba(255,200,97,.15)}
.note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:18px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2)}

/* ===== Talk screen ===== */
#talk{padding:0}
.top{display:flex;align-items:center;gap:8px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.18)}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--green);box-shadow:0 0 10px var(--green)}
.pill.bad i{background:var(--red)}
.room{font-size:13px;color:var(--muted)}
.sp{flex:1}
.icon{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:19px;display:grid;place-items:center}
.stage{padding:14px 14px 4px}
.subtitle{border-radius:22px;padding:18px;min-height:150px;background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(255,90,106,.12));border:1px solid var(--line);position:relative}
.subtitle .who{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.subtitle .big{font-size:calc(28px * var(--fs));font-weight:800;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.subtitle .orig{font-size:calc(15px * var(--fs));color:var(--muted);margin-top:8px;line-height:1.45}
.subtitle.live .big{color:#d8e3ff}
.subtitle .ph{color:var(--muted);font-size:17px;font-weight:500}
.speaking{display:none;position:absolute;right:14px;top:14px;font-size:13px;color:var(--gold)}
.subtitle.tts .speaking{display:block}
.log{flex:1;overflow-y:auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;line-height:1.45;font-size:calc(16px * var(--fs));animation:fade .25s}
.msg small{display:block;color:var(--muted);font-size:calc(13px * var(--fs));margin-top:4px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:rgba(255,200,97,.16);border:1px solid rgba(255,200,97,.3);border-bottom-right-radius:6px}
.msg .replay{margin-left:6px;opacity:.7}
.bottom{padding:10px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.22)}
.myinterim{min-height:22px;color:var(--gold);font-size:15px;text-align:center;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px}
.mic{width:86px;height:86px;border-radius:50%;font-size:36px;background:linear-gradient(135deg,var(--blue),#7a5cff);box-shadow:0 8px 26px rgba(79,140,255,.45);position:relative;transition:.2s}
.mic.on{background:linear-gradient(135deg,var(--red),#ff8a5c);box-shadow:0 8px 30px rgba(255,90,106,.55)}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(255,90,106,.6);animation:pulse 1.4s infinite}
.mic.hold{background:linear-gradient(135deg,#6b6f86,#4a4e66);box-shadow:none}
.mic.hold::after{display:none}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.25);opacity:0}}
.miclabel{text-align:center;color:var(--muted);font-size:14px;margin-top:8px}
.typebar{display:none;gap:8px;margin-top:10px}
.typebar.on{display:flex}
.typebar input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);outline:none;font-size:16px}
.typebar button{padding:0 16px;border-radius:14px;background:var(--gold);color:#2a1600;font-weight:800}

/* ===== Solo (face-to-face) ===== */
#solo{padding:0}
.half{flex:1;display:flex;flex-direction:column;padding:14px;gap:10px;min-height:0}
.half.flip{transform:rotate(180deg);background:rgba(255,90,106,.06)}
.half .subtitle{flex:1;min-height:0;overflow-y:auto}
.half .row{display:flex;align-items:center;gap:12px}
.half .mic{width:70px;height:70px;font-size:30px;flex:none}
.half .hint{flex:1;font-size:14px;color:var(--muted)}
.half .hint b{color:var(--text);font-size:16px;display:block}
.half .myinterim{text-align:left;margin:0}
.divider{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
.divider button{font-size:13px;color:var(--muted);padding:4px 10px;border-radius:10px;background:var(--card)}

/* ===== Sheet ===== */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-height:90vh;overflow-y:auto;background:#16244a;border-radius:24px 24px 0 0;padding:20px 20px max(24px,env(safe-area-inset-bottom));animation:up .25s}
.apisec{margin-top:16px;padding:14px;border-radius:18px;background:rgba(255,200,97,.07);border:1px solid rgba(255,200,97,.25)}
.apihead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.apist{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--card);color:var(--muted);white-space:nowrap}
.apist.ok{background:rgba(56,211,159,.18);color:var(--green)}
.apirow{display:flex;gap:8px}
.apisec input,.apisec textarea{flex:1;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);outline:none;font-size:15px;resize:vertical}
.apisec textarea{margin-top:8px;font-size:14px}
.apirow button{width:46px;border-radius:12px;background:var(--card);font-size:18px}
.apibtns{display:flex;gap:8px;margin-top:10px}
.apibtns .btn{font-size:15px;padding:12px 8px}
.apimsg{font-size:13px;line-height:1.5;color:var(--muted);margin-top:10px;white-space:pre-line}
.ai{display:none;font-size:12px;font-weight:800;padding:5px 9px;border-radius:99px;background:linear-gradient(135deg,var(--gold),#ff9d5c);color:#2a1600}
.ai.on{display:inline-block}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.seg{display:flex;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card);font-size:14px}
.seg button.on{background:var(--gold);color:#2a1600;font-weight:700}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:12px 18px;border-radius:14px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- 1. Language -->
<section class="screen active" id="s-lang">
  <div class="logo">🗣️</div>
  <h1>실시간 통역 · 实时翻译</h1>
  <p class="sub">내가 쓰는 언어를 고르세요<br>请选择您使用的语言 · Choose your language</p>
  <div class="choices">
    <button class="choice" data-lang="ko"><span class="flag">🇰🇷</span><div><b>한국어</b><span>저는 한국어로 말해요</span></div></button>
    <button class="choice" data-lang="zh"><span class="flag">🇨🇳</span><div><b>中文</b><span>我说中文</span></div></button>
    <button class="choice" data-lang="en"><span class="flag">🇺🇸</span><div><b>English</b><span>I speak English</span></div></button>
  </div>
</section>

<!-- 2. Mode -->
<section class="screen" id="s-mode">
  <button class="back" data-go="s-lang">← <span data-t="back"></span></button>
  <h1 data-t="modeTitle"></h1>
  <p class="sub" data-t="modeSub"></p>
  <div class="choices">
    <button class="choice" id="b-create"><span class="flag">📱</span><div><b data-t="create"></b><span data-t="createDesc"></span></div></button>
    <button class="choice" id="b-join"><span class="flag">🔗</span><div><b data-t="join"></b><span data-t="joinDesc"></span></div></button>
    <button class="choice" id="b-solo"><span class="flag">🤝</span><div><b data-t="solo"></b><span data-t="soloDesc"></span></div></button>
  </div>
  <div class="note" data-t="tip"></div>
  <div style="height:12px"></div>
  <button class="btn ghost" id="b-api" data-t="apiBtn"></button>
</section>

<!-- 3a. Create room -->
<section class="screen" id="s-create">
  <button class="back" id="create-back">← <span data-t="back"></span></button>
  <h2 data-t="yourCode"></h2>
  <div class="codebox">
    <div class="code" id="room-code">----</div>
    <div class="qr" id="qr"></div>
    <p class="sub" style="margin:8px 0 0" data-t="shareHint"></p>
  </div>
  <div class="wait"><span class="dot"></span><span id="create-status" data-t="waiting"></span></div>
  <button class="btn ghost" id="b-startnow" data-t="startNow"></button>
</section>

<!-- 3b. Join -->
<section class="screen" id="s-join">
  <button class="back" data-go="s-mode">← <span data-t="back"></span></button>
  <h2 data-t="enterCode"></h2>
  <input class="codeinput" id="code-in" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
  <div style="height:16px"></div>
  <button class="btn" id="b-connect" data-t="connect"></button>
</section>

<!-- 3c. Solo setup -->
<section class="screen" id="s-solosetup">
  <button class="back" data-go="s-mode">← <span data-t="back"></span></button>
  <h2 data-t="partnerLangQ"></h2>
  <div class="langrow" id="solo-langs"></div>
  <button class="btn" id="b-solostart" data-t="start"></button>
  <div class="note" data-t="soloNote"></div>
</section>

<!-- 4. Talk (two phones) -->
<section class="screen" id="talk">
  <div class="top">
    <div class="pill" id="net-pill"><i></i><span id="net-text"></span></div>
    <span class="room" id="room-label"></span>
    <span class="ai" id="ai-badge">✨ AI</span>
    <span class="sp"></span>
    <button class="icon" id="b-type" title="keyboard">⌨️</button>
    <button class="icon" id="b-set" title="settings">⚙️</button>
  </div>
  <div class="stage">
    <div class="subtitle" id="sub-main">
      <div class="who"><span id="sub-who"></span></div>
      <span class="speaking">🔊</span>
      <div class="big" id="sub-big"><span class="ph" data-t="subPh"></span></div>
      <div class="orig" id="sub-orig"></div>
    </div>
  </div>
  <div class="log" id="log"></div>
  <div class="bottom">
    <div class="myinterim" id="my-interim"></div>
    <div class="ctrl"><button class="mic" id="mic">🎙️</button></div>
    <div class="miclabel" id="mic-label"></div>
    <div class="typebar" id="typebar"><input id="type-in" autocomplete="off"><button id="type-send" data-t="send"></button></div>
  </div>
</section>

<!-- 5. Solo face-to-face -->
<section class="screen" id="solo">
  <div class="half flip" id="half-b">
    <div class="subtitle" id="sub-b"><div class="who" id="who-b"></div><span class="speaking">🔊</span><div class="big" id="big-b"></div><div class="orig" id="orig-b"></div></div>
    <div class="myinterim" id="int-b"></div>
    <div class="row"><button class="mic" id="mic-b">🎙️</button><div class="hint" id="hint-b"></div></div>
  </div>
  <div class="divider"><button id="solo-exit">✕ <span data-t="leave"></span></button><button id="solo-set">⚙️</button></div>
  <div class="half" id="half-a">
    <div class="subtitle" id="sub-a"><div class="who" id="who-a"></div><span class="speaking">🔊</span><div class="big" id="big-a"></div><div class="orig" id="orig-a"></div></div>
    <div class="myinterim" id="int-a"></div>
    <div class="row"><button class="mic" id="mic-a">🎙️</button><div class="hint" id="hint-a"></div></div>
  </div>
</section>

<!-- Settings sheet -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h2 data-t="settings"></h2>
    <div class="setrow"><span data-t="voice"></span><div class="seg" id="set-voice"><button data-v="1">ON</button><button data-v="0">OFF</button></div></div>
    <div class="setrow"><span data-t="speed"></span><div class="seg" id="set-rate"><button data-v="0.8">0.8×</button><button data-v="1">1×</button><button data-v="1.2">1.2×</button></div></div>
    <div class="setrow"><span data-t="font"></span><div class="seg" id="set-fs"><button data-v="1">A</button><button data-v="1.25">A+</button><button data-v="1.55">A++</button></div></div>
    <div class="apisec" id="api-sec">
      <div class="apihead"><b data-t="apiTitle"></b><span class="apist" id="api-status"></span></div>
      <div class="apirow"><input id="api-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="api-eye" title="show">👁</button></div>
      <textarea id="api-notes" rows="2"></textarea>
      <div class="apibtns"><button class="btn" id="api-save" data-t="apiSave"></button><button class="btn ghost" id="api-try" data-t="apiTry"></button><button class="btn ghost" id="api-del" style="flex:0 0 72px" data-t="apiDel"></button></div>
      <div class="apimsg" id="api-msg"></div>
    </div>
    <div style="height:16px"></div>
    <button class="btn ghost" id="b-leave" data-t="leave"></button>
    <div style="height:10px"></div>
    <button class="btn" id="b-close" data-t="close"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= Languages & UI text ================= */
const LANGS = {
  ko:{flag:'🇰🇷', name:'한국어', sr:'ko-KR', gt:'ko',    mm:'ko-KR', en:'Korean'},
  zh:{flag:'🇨🇳', name:'中文',   sr:'zh-CN', gt:'zh-CN', mm:'zh-CN', en:'Simplified Chinese (Mandarin)'},
  en:{flag:'🇺🇸', name:'English',sr:'en-US', gt:'en',    mm:'en-US', en:'English'}
};
const T = {
ko:{back:'뒤로',modeTitle:'어떻게 대화할까요?',modeSub:'각자 휴대폰을 쓰면 상대 휴대폰에 자막과 음성으로 통역돼요.',
 create:'방 만들기',createDesc:'코드를 만들어 상대에게 보여주세요',join:'방 참여하기',joinDesc:'상대가 보여준 4자리 코드 입력',
 solo:'한 대로 마주보고 대화',soloDesc:'휴대폰 하나를 테이블에 두고 함께 사용',
 tip:'💡 Android는 크롬, 아이폰은 사파리에서 사용하세요. 처음 마이크 권한을 꼭 "허용"해 주세요. 학교 Wi-Fi에 연결하면 가장 안정적이에요.',
 yourCode:'방 코드',shareHint:'상대방이 QR을 찍거나 코드를 입력하면 연결돼요',waiting:'상대방을 기다리는 중…',startNow:'먼저 들어가서 기다리기',
 enterCode:'4자리 방 코드를 입력하세요',connect:'연결하기',partnerLangQ:'상대방 언어를 고르세요',start:'시작하기',
 soloNote:'휴대폰을 두 사람 사이에 놓으세요. 위쪽 화면은 상대방을 향해 뒤집혀 보여요. 말할 사람이 자기 쪽 마이크 버튼을 누르세요.',

 tapToTalk:'버튼을 누르고 말하세요',listening:'듣고 있어요… 다시 누르면 멈춰요',hold:'상대 음성 재생 중 — 잠시 멈춤',
 connected:'연결됨',connecting:'연결 중…',offline:'연결 끊김',alone:'상대 기다리는 중',joined:'상대방이 들어왔어요!',left:'상대방 연결이 끊겼어요',

async function freeTranslate(text, from, to){
  let out = null;
  try{
    const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+LANGS[from].gt+'&tl='+LANGS[to].gt+'&q='+encodeURIComponent(text);
    const r = await fetch(u); if(!r.ok) throw 0;
    const d = await r.json(); out = d[0].map(s=>s[0]).join('').trim();
  }catch(e){
    try{
      const u = 'https://api.mymemory.translated.net/get?langpair='+LANGS[from].mm+'|'+LANGS[to].mm+'&q='+encodeURIComponent(text);
      const r = await fetch(u); const d = await r.json();
      if(d && d.responseData && d.responseStatus==200) out = d.responseData.translatedText;
    }catch(e2){}
  }
  return out;
}

const convo = [];   // recent utterances, used as context for AI translation
function remember(text, lang){ convo.push({text, lang}); if(convo.length>8) convo.shift(); }

function apiErr(status, msg){ const e = new Error(msg||('HTTP '+status)); e.status = status; return e; }
async function jfetch(url, opts, ms=15000){
  const ac = new AbortController(); const tm = setTimeout(()=>ac.abort(), ms);
  try{
    const r = await fetch(url, Object.assign({signal:ac.signal}, opts));
    if(!r.ok){ let tx=''; try{ tx = await r.text(); }catch{} throw apiErr(r.status, tx.slice(0,300)); }
    return r;
  }catch(e){ if(e.status) throw e; throw apiErr(0, String(e && e.message || e)); }
  finally{ clearTimeout(tm); }
}
const isModelErr = e => e.status===404 || (e.status===400 && /model|not.?found|not.?supported|does not exist|invalid.*model/i.test(e.message));
function b64FromBuf(buf){ const u8=new Uint8Array(buf); let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function cleanOut(s){ return (s||'').trim().replace(/^["“「『']+|["”」』']+$/g,'').trim(); }

const MODELS = {
  openai: ['gpt-4.1-mini','gpt-4o-mini','gpt-5-mini'],
  claude: ['claude-haiku-5-5','claude-haiku-4-5','claude-sonnet-4-5','claude-3-5-haiku-latest'],
  gemini: ['gemini-2.5-flash-lite','gemini-flash-lite-latest','gemini-2.0-flash','gemini-2.5-flash','gemini-flash-latest'],
  oaTTS:  ['gpt-4o-mini-tts','tts-1'],
};
const GVOICES = {
  ko: [['ko-KR','ko-KR-Chirp3-HD-Aoede'],['ko-KR','ko-KR-Neural2-A'],['ko-KR','ko-KR-Wavenet-A']],
  zh: [['cmn-CN','cmn-CN-Chirp3-HD-Aoede'],['cmn-CN','cmn-CN-Wavenet-A'],['cmn-CN','cmn-CN-Standard-A']],
  en: [['en-US','en-US-Chirp3-HD-Aoede'],['en-US','en-US-Neural2-F'],['en-US','en-US-Wavenet-F']],
};
const Api = {
  key: store.get('apikey',''), notes: store.get('apinotes',''),
  st: store.get('apistate', null),   // {kind, model, tts, ttsModel, gv:{lang:index}}
  lastWarn: 0,
  ready(){ return !!(this.key && this.st && this.st.kind); },
  canSpeak(){ return this.ready() && !!this.st.tts; },
  detect(k){ if(/^sk-ant-/.test(k)) return 'claude'; if(/^sk-/.test(k)) return 'openai'; if(/^AIza/.test(k)) return 'google'; return null; },
  save(){ store.set('apistate', this.st); },
  warn(){ const n=Date.now(); if(n-this.lastWarn>20000){ this.lastWarn=n; toast(t('apiErr'),3500); } },

  prompt(from, to){
    let s = 'You are a professional live interpreter at a Korean middle school during an official visit (guests include education officials from Shanghai, China). '
      + 'Translate the speaker\'s utterance from '+LANGS[from].en+' into '+LANGS[to].en+'. '
      + 'Use natural, warm, polite spoken language suitable for a formal conversation with honored guests. '
      + (to==='ko' ? 'In Korean use polite 존댓말 (합니다/해요체). ' : '')
      + (to==='zh' ? 'In Chinese use Simplified characters and the polite 您. ' : '')
      + 'The text comes from speech recognition and may contain recognition errors or missing punctuation: infer the intended meaning and add punctuation. '
      + 'Keep names, titles and numbers accurate. Output ONLY the translation, with no quotes, notes or explanations.';
    if(this.notes.trim()) s += '\nGlossary / names to use (source=target): '+this.notes.trim();
    return s;
  },
  userMsg(text, from){
    const ctx = convo.filter(c=>c.text!==text).slice(-6).map(c=>'['+LANGS[c.lang].en+'] '+c.text).join('\n');
    return (ctx ? 'Recent conversation (context only, do not translate):\n'+ctx+'\n\n' : '')
      + 'Utterance to translate ('+LANGS[from].en+'):\n'+text;
  },
  async withModels(list, saved, fn){
    const order = saved ? [saved, ...list.filter(m=>m!==saved)] : list;
    let last;
    for(const m of order){
      try{ const out = await fn(m); return {out, model:m}; }
      catch(e){ last = e; if(!isModelErr(e)) throw e; }
    }
    throw last || apiErr(0,'no model');
  },
  async llm(kind, sys, user, savedModel){
    const k = this.key;
    if(kind==='openai') return this.withModels(MODELS.openai, savedModel, async m=>{
      const body = {model:m, messages:[{role:'system',content:sys},{role:'user',content:user}]};
      if(!/^gpt-5/.test(m)) body.temperature = 0.2;
      const r = await jfetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify(body)});
      const d = await r.json(); return d.choices[0].message.content;
    });
    if(kind==='claude') return this.withModels(MODELS.claude, savedModel, async m=>{
      const r = await jfetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:m, max_tokens:500, system:sys, messages:[{role:'user',content:user}]})});
      const d = await r.json(); return (d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    });
    if(kind==='gemini') return this.withModels(MODELS.gemini, savedModel, async m=>{
      const r = await jfetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({systemInstruction:{parts:[{text:sys}]}, contents:[{role:'user',parts:[{text:user}]}], generationConfig:{temperature:0.2, maxOutputTokens:1024}})});
      const d = await r.json(); const out = ((d.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      if(!out) throw apiErr(500,'empty'); return out;
    });
    throw apiErr(0,'unknown');
  },
  async gcloudTranslate(text, from, to){
    const r = await jfetch('https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(this.key),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q:text, source:LANGS[from].gt, target:LANGS[to].gt, format:'text'})});
    const d = await r.json(); return d.data.translations[0].translatedText;
  },
  async translate(text, from, to){
    const st = this.st;
    if(st.kind==='gcloud') return cleanOut(await this.gcloudTranslate(text, from, to));
    const {out, model} = await this.llm(st.kind, this.prompt(from,to), this.userMsg(text,from), st.model);
    if(model!==st.model){ st.model=model; this.save(); }
    return cleanOut(out);
  },

  /* natural voice → base64 mp3 */
  speechCache: new Map(),
  speech(text, lang){
    if(!this.canSpeak() || !text) return Promise.resolve(null);
    const ck = lang+'|'+S.rate+'|'+text;
    if(this.speechCache.has(ck)) return this.speechCache.get(ck);
    const p = this._speech(text, lang).catch(e=>{ console.warn('tts', e); return null; });
    this.speechCache.set(ck, p); p.then(v=>{ if(!v) this.speechCache.delete(ck); });
    if(this.speechCache.size>60) this.speechCache.delete(this.speechCache.keys().next().value);
    return p;
  },
  async _speech(text, lang, stOverride){
    const st = stOverride || this.st, k = this.key;
    if(st.tts==='openai'){
      const {out, model} = await this.withModels(MODELS.oaTTS, st.ttsModel, async m=>{
        const body = {model:m, input:text, response_format:'mp3'};
        if(m==='tts-1'){ body.voice='nova'; body.speed=S.rate; }
        else { body.voice='coral'; body.instructions='Speak in a warm, polite, natural voice at a calm conversational pace, like a friendly professional interpreter.'+(S.rate<1?' Speak a little slowly.':S.rate>1?' Speak a little quickly.':''); }
        const r = await jfetch('https://api.openai.com/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify(body)}, 20000);
        return b64FromBuf(await r.arrayBuffer());
      });
      if(model!==st.ttsModel){ st.ttsModel=model; this.save(); }
      return out;
    }
    if(st.tts==='gcloud'){
      st.gv = st.gv || {};
      const list = GVOICES[lang]; let i = st.gv[lang]||0, last;
      for(; i<list.length; i++){
        try{
          const r = await jfetch('https://texttospeech.googleapis.com/v1/text:synthesize?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({input:{text}, voice:{languageCode:list[i][0], name:list[i][1]}, audioConfig:{audioEncoding:'MP3', speakingRate:S.rate}})}, 20000);
          const d = await r.json();
          if(st.gv[lang]!==i){ st.gv[lang]=i; this.save(); }
          return d.audioContent;
        }catch(e){ last=e; if(e.status!==400 && e.status!==404) throw e; }
      }
      throw last;
    }
    return null;
  },

  /* first-time check when the key is saved */
  async setup(key){
    const kind = this.detect(key);
    if(!kind) return {ok:false, msg:'❌ 알 수 없는 키 형식이에요.\n지원: OpenAI(sk-…), Claude(sk-ant-…), Google(AIza…)\n파파고·DeepL 키라면 휴대폰에서 직접 쓸 수 없어서 중간 서버가 필요해요.'};
    this.key = key;
    const sys = this.prompt('ko','zh'), user = 'Utterance to translate (Korean):\n안녕하세요, 저희 학교에 오신 것을 환영합니다';
    const st = {kind:null};
    let sample = '', info = [];
    const why = e => e.status===401||e.status===403 ? '키가 올바르지 않거나 권한이 없어요' : e.status===429 ? '사용 한도 초과 또는 결제(크레딧) 확인이 필요해요' : e.status===0 ? '인터넷 연결 또는 접속이 막혔어요' : ('오류 '+e.status);
    try{
      if(kind==='google'){
        try{ const g = await this.llm('gemini', sys, user); st.kind='gemini'; st.model=g.model; sample=g.out; }
        catch(e1){ try{ sample = await this.gcloudTranslate('안녕하세요, 저희 학교에 오신 것을 환영합니다','ko','zh'); st.kind='gcloud'; }catch(e2){ throw e2.status? e2 : e1; } }
      } else { const r = await this.llm(kind, sys, user); st.kind=kind; st.model=r.model; sample=r.out; }
    }catch(e){ this.key = store.get('apikey',''); return {ok:false, msg:'❌ 연결 실패: '+why(e)}; }
    // natural voice
    const ttsKind = kind==='openai' ? 'openai' : kind==='google' ? 'gcloud' : null;
    if(ttsKind){
      const tst = Object.assign({}, st, {tts:ttsKind});
      try{ const a = await this._speech('您好','zh', tst); if(a){ st.tts=ttsKind; st.ttsModel=tst.ttsModel; st.gv=tst.gv; } }catch(e){ console.warn(e); }
    }
    this.st = st; store.set('apikey', key); this.save();
    this.speechCache.clear(); tcache.clear();
    const name = {openai:'OpenAI', claude:'Claude', gemini:'Google Gemini', gcloud:'Google 번역'}[st.kind];
    info.push('✅ '+name+' 연결 성공'+(st.model?' ('+st.model+')':''));
    info.push('번역 예시: '+cleanOut(sample));
    info.push(st.tts ? '🔊 자연스러운 AI 목소리 사용' : (kind==='claude' ? '🔊 Claude는 음성 기능이 없어서, 휴대폰의 가장 자연스러운 목소리를 골라 써요' : '🔊 AI 음성은 이 키로 쓸 수 없어서 휴대폰 목소리를 써요'));
    return {ok:true, msg:info.join('\n')};
  },
  clear(){ this.key=''; this.st=null; store.set('apikey',''); store.set('apistate',null); this.speechCache.clear(); tcache.clear(); }
};

const tcache = new Map();   // key -> Promise<string|null>
function translate(text, from, to, opts={}){
  if(!text || from===to) return Promise.resolve(text);
  const useApi = Api.ready() && !opts.free;
  const key = (useApi?'A|':'F|')+from+'|'+to+'|'+text;
  if(tcache.has(key)) return tcache.get(key);
  const p = (async()=>{
    if(useApi){ try{ const r = await Api.translate(text, from, to); if(r) return r; }catch(e){ console.warn('api', e); Api.warn(); } }
    return freeTranslate(text, from, to);
  })();
  tcache.set(key, p); p.then(v=>{ if(!v) tcache.delete(key); });
  if(tcache.size>300) tcache.delete(tcache.keys().next().value);
  return p;
}

/* ================= Speech output ================= */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices()||[]; }catch{} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
// pick the most natural-sounding built-in voice
function pickVoice(lang){
  const pre = LANGS[lang].sr.toLowerCase(), base = pre.split('-')[0];
  const list = voices.filter(v=>v.lang && v.lang.toLowerCase().replace('_','-').startsWith(base));
  const score = v=>{
    const n = v.name||'', l = v.lang.toLowerCase().replace('_','-'); let s = 0;
    if(/natural|neural|premium|enhanced|online|siri/i.test(n)) s += 5;
    if(/google/i.test(n)) s += 3;
    if(v.localService===false) s += 1;
    if(l===pre) s += 2;
    if(lang==='zh' && /zh-cn|cmn/.test(l)) s += 3;
    if(lang==='zh' && /hk|tw|yue/.test(l)) s -= 4;
    if(/compact|eloquence|novelty|bells|whisper|zarvox|bad news|bahh|boing|bubbles|cellos|jester|organ|superstar|trinoids|wobble/i.test(n)) s -= 6;
    return s;
  };
  return list.sort((a,b)=>score(b)-score(a))[0] || null;
}
// one reusable <audio> element; "unlocked" on the first tap so later plays are allowed (iPhone)
const player = new Audio(); player.setAttribute('playsinline',''); player.preload='auto';
const SILENT = (()=>{ const n=800, b=new ArrayBuffer(44+n), v=new DataView(b); const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128); return 'data:audio/wav;base64,'+b64FromBuf(b); })();
let audioUnlocked = false;
function unlockAudio(){
  try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch{}
  if(!audioUnlocked){ try{ player.src = SILENT; const p = player.play(); if(p) p.then(()=>{ audioUnlocked=true; }).catch(()=>{}); }catch{} }
}
function playB64(b64){
  return new Promise(res=>{
    let done=false, url=null; const fin=ok=>{ if(done) return; done=true; if(url) setTimeout(()=>URL.revokeObjectURL(url),1000); res(ok); };
    try{
      const bin = atob(b64), u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      url = URL.createObjectURL(new Blob([u8],{type:'audio/mpeg'}));
      player.onended = ()=>fin(true); player.onerror = ()=>fin(false);
      player.onloadedmetadata = ()=>{ if(isFinite(player.duration)) setTimeout(()=>fin(true), player.duration*1000/S.rate + 1500); };
      player.src = url; player.defaultPlaybackRate = 1; player.playbackRate = 1;
      const p = player.play(); if(p) p.catch(()=>fin(false));
      setTimeout(()=>fin(true), 40000);
    }catch{ fin(false); }
  });
}
function browserSpeak(text, lang){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    let done=false; const fin=()=>{ if(done) return; done=true; res(); };
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANGS[lang].sr; const v = pickVoice(lang); if(v) u.voice = v;
      u.rate = S.rate; u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
      setTimeout(fin, 2500 + text.length*(lang==='en'?90:280)/S.rate);
    }catch{ fin(); }
  });
}
const withTimeout = (p, ms) => Promise.race([p, new Promise(r=>setTimeout(()=>r(null), ms))]);
let ttsChain = Promise.resolve(), ttsCount = 0;
// audioP: optional Promise<base64 mp3> made by the AI phone; otherwise this phone makes it (if it has a key)
function speak(text, lang, onStart, onEnd, audioP){
  if(!S.voice || !text) return;
  if(!audioP && Api.canSpeak()) audioP = Api.speech(text, lang);
  ttsCount++;
  if(ttsCount===1){ Listener.pause('tts'); Net.send({type:'tts', on:true}); }
  ttsChain = ttsChain.then(async()=>{
    onStart && onStart();
    let b64 = null; if(audioP){ try{ b64 = await withTimeout(audioP, 9000); }catch{} }
    let ok = false; if(b64 && S.voice) ok = await playB64(b64);
    if(!ok && S.voice) await browserSpeak(text, lang);
  }).catch(()=>{}).then(()=>{
    onEnd && onEnd();
    ttsCount--;
    if(ttsCount===0){ Net.send({type:'tts', on:false}); setTimeout(()=>Listener.resume('tts'), 350); }
  });
}

/* ================= Speech input (recognition) ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isAndroid = /android/i.test(navigator.userAgent);
const Listener = {
  rec:null, want:false, lang:null, cb:null, holds:new Set(), lastInterim:'', fatal:false,
  start(lang, cb){ this.stop(); this.lang=lang; this.cb=cb; this.want=true; this.fatal=false; this._run(); this._state(); },
  stop(){ this.want=false; this._kill(); this.lastInterim=''; this._state(); },
  active(){ return this.want; },
  pause(reason){ this.holds.add(reason); this._flush(); this._kill(); this._state(); },
  resume(reason){ this.holds.delete(reason); this._state(); if(this.holds.size===0) setTimeout(()=>this._run(),150); },
  _state(){ this.cb && this.cb.state && this.cb.state(this.want, this.holds.size>0); },
  _flush(){ const s=this.lastInterim.trim(); this.lastInterim=''; if(s && this.cb){ this.cb.interim(''); this.cb.final(s); } },
  _kill(){ const r=this.rec; this.rec=null; if(r){ try{ r.onresult=null; r.abort(); }catch{} } },
  _run(){
    if(!SR || !this.want || this.holds.size>0 || this.rec) return;
    const r = new SR();
    r.lang = LANGS[this.lang].sr; r.interimResults = true; r.maxAlternatives = 1;
    r.continuous = !isAndroid;
    r.onresult = e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i], txt=res[0].transcript;
        if(res.isFinal){ const s=txt.trim(); this.lastInterim=''; if(s) this.cb.final(s); }
        else interim += txt;
      }
      this.lastInterim = interim; this.cb.interim(interim.trim());
    };
    r.onerror = e=>{
      if(e.error==='not-allowed' || e.error==='service-not-allowed'){ this.want=false; this.fatal=true; toast(t('micDenied'),5000); this._state(); }
    };
    r.onend = ()=>{
      if(this.rec!==r) return;
      this.rec=null; this._flush();
      if(this.want && this.holds.size===0 && !this.fatal) setTimeout(()=>this._run(), 120);
    };
    try{ r.start(); this.rec=r; }catch(err){ this.rec=null; setTimeout(()=>this._run(), 500); }
  }
};

/* ================= Network (public MQTT brokers, all at once) ================= */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const myId = Math.random().toString(36).slice(2,10);
const Net = {
  clients:[], topic:null, seen:new Set(), peers:new Map(), onMsg:null, timer:null,
  connect(room){
    this.close(); this.topic = 'hj33-interp/v1/room-'+room;
    BROKERS.forEach(url=>{
      try{
        const c = mqtt.connect(url, {clientId:'itp_'+myId+'_'+Math.random().toString(36).slice(2,6), clean:true, connectTimeout:8000, reconnectPeriod:3000, keepalive:30});
        c.on('connect', ()=>{ c.subscribe(this.topic, {qos:0}); this.send({type:'hello'}); updateNet(); });
        c.on('close', updateNet); c.on('offline', updateNet); c.on('error', ()=>{});
        c.on('message', (tp, buf)=>{
          let m; try{ m=JSON.parse(buf.toString()); }catch{ return; }
          if(!m || m.from===myId || this.seen.has(m.mid)) return;
          this.seen.add(m.mid); if(this.seen.size>500) this.seen.delete(this.seen.values().next().value);
          this._handle(m);
        });
        this.clients.push(c);
      }catch(e){}
    });
    this.timer = setInterval(()=>{ this.send({type:'ping'}); this._prune(); }, 7000);
    updateNet();
  },
  close(){ clearInterval(this.timer); this.clients.forEach(c=>{try{c.end(true)}catch{}}); this.clients=[]; this.peers.clear(); },
  online(){ return this.clients.some(c=>c.connected); },
  send(obj){
    if(!this.topic) return;
    const m = Object.assign({mid:myId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6), from:myId, lang:S.my, api:Api.ready()?1:0}, obj);
    const s = JSON.stringify(m);
    this.clients.forEach(c=>{ if(c.connected) try{ c.publish(this.topic, s, {qos:0}); }catch{} });
  },
  _handle(m){
    const isNew = !this.peers.has(m.from);
    this.peers.set(m.from, {lang:m.lang, api:!!m.api, last:Date.now()});
    if(isNew){ this.send({type:'hello'}); onPeerJoin(m.from); updateNet(); }
    if(m.type==='bye'){ this.peers.delete(m.from); releaseHold(m.from); updateNet(); toast(t('left')); return; }
    this.onMsg && this.onMsg(m);
  },
  _prune(){
    const now=Date.now(); let ch=false;
    for(const [id,p] of this.peers){ if(now-p.last>25000){ this.peers.delete(id); releaseHold(id); ch=true; } }
    if(ch){ updateNet(); toast(t('left')); }
  },
  partnerLang(){ for(const p of this.peers.values()) if(p.lang!==S.my) return p.lang; return null; }
};
/* The phone with an API key ("AI phone") also translates + makes voice for phones without a key.
   If several phones have keys, only the one with the smallest id does it (no double cost). */
function hostInRoom(){ if(Api.ready()) return true; for(const p of Net.peers.values()) if(p.api) return true; return false; }
function isHost(){ if(!Api.ready()) return false; for(const [id,p] of Net.peers) if(p.api && id<myId) return false; return true; }
const relay = new Map();   // sid -> {tr:{}, audio:{}, au:false, w:[]}
function rbox(sid){ let b=relay.get(sid); if(!b){ b={tr:{},audio:{},mine:{},au:false,w:[]}; relay.set(sid,b); if(relay.size>80) relay.delete(relay.keys().next().value); } return b; }
function waitRelay(sid, kind, lang, ms){
  return new Promise(res=>{ const b=rbox(sid); if(lang in b[kind]) return res(b[kind][lang]);
    const w={kind,lang,res}; b.w.push(w); setTimeout(()=>{ const i=b.w.indexOf(w); if(i>=0){ b.w.splice(i,1); res(undefined); } }, ms); });
}
function deliver(sid, kind, lang, val){ const b=rbox(sid); b[kind][lang]=val; b.w=b.w.filter(w=>{ if(w.kind===kind&&w.lang===lang){ w.res(val); return false; } return true; }); }
async function hostServe(sid, text, from){
  if(!isHost()) return;
  const langs = new Set(); for(const p of Net.peers.values()) if(!p.api && p.lang && p.lang!==from) langs.add(p.lang);
  const keyless = [...Net.peers.values()].some(p=>!p.api);
  if(!keyless) return;
  const trLangs = new Set(langs); if(from!==S.my) trLangs.add(S.my);   // also lets the speaker see how it was translated
  const tr = {};
  await Promise.all([...trLangs].map(async L=>{ tr[L] = (await translate(text, from, L)) || null; }));
  const au = Api.canSpeak() && S.voice;
  Net.send({type:'tr', sid, tr, au:au?1:0});
  if(!au) return;
  [...langs].forEach(L=>{
    if(!tr[L]) return Net.send({type:'audio', sid, to:L, none:1});
    Api.speech(tr[L], L).then(b64=>{
      if(b64 && b64.length < 230000) Net.send({type:'audio', sid, to:L, b64});
      else Net.send({type:'audio', sid, to:L, none:1});
    });
  });
}
function updateNet(){
  const pill=$('net-pill'), txt=$('net-text'); if(!pill) return;
  const n = Net.peers.size, on = Net.online();
  pill.classList.toggle('ok', on && n>0); pill.classList.toggle('bad', !on);
  if(!on) txt.textContent = Net.clients.length? t('connecting') : t('offline');
  else if(n===0) txt.textContent = t('alone');
  else { const flags=[...Net.peers.values()].map(p=>LANGS[p.lang]?.flag||'').join(''); txt.textContent = t('connected')+' '+flags; }
  const ai=$('ai-badge'); if(ai) ai.classList.toggle('on', hostInRoom());
  if(S.mode==='create' && n>0 && document.getElementById('s-create').classList.contains('active')) enterTalk();
}
const holdTimers = new Map();
function releaseHold(id){ clearTimeout(holdTimers.get(id)); holdTimers.delete(id); Listener.resume('peer-'+id); }
function onPeerJoin(){ toast(t('joined')); }
window.addEventListener('pagehide', ()=>Net.send({type:'bye'}));

const talkCb = {
  interim(txt){ $('my-interim').textContent = txt ? '🎙 '+txt : ''; if(txt) sendInterim(txt); },
  final(txt){ $('my-interim').textContent=''; sendFinal(txt); },
  state(want, held){ setMicUI(want, held); }
};
function setMicUI(want, held){

let lastInterimSent=0, interimSid=null;
function sendInterim(txt){
  const now=Date.now(); if(now-lastInterimSent<450) return; lastInterimSent=now;
  if(!interimSid) interimSid = myId+'-'+now;
  Net.send({type:'interim', text:txt, sid:interimSid});
}
function sendFinal(txt){
  const sid = interimSid || (myId+'-'+Date.now()); interimSid=null;
  Net.send({type:'final', text:txt, sid});
  remember(txt, S.my);
  const el = addLog('me', txt, '');
  hostServe(sid, txt, S.my);
  const pl = Net.partnerLang();
  if(pl){
    const show = tr=>{ if(tr) el.querySelector('small').textContent = LANGS[pl].flag+' '+tr; };
    if(!Api.ready() && hostInRoom()) waitRelay(sid,'mine',pl,8000).then(tr=> tr ? show(tr) : translate(txt, S.my, pl).then(show));
    else translate(txt, S.my, pl).then(show);
  }
}

function addLog(who, big, small, lang){
  const d=document.createElement('div'); d.className='msg '+who;
  const b=document.createElement('div'); b.textContent=big; d.appendChild(b);
  const s=document.createElement('small'); s.textContent=small; d.appendChild(s);
  if(who==='them' && lang){
    const r=document.createElement('button'); r.className='replay'; r.textContent='🔊';
    r.onclick=()=>{ unlockAudio(); speak(big, S.my, null, null, d._audio); }; b.appendChild(r);
  }
  const log=$('log'); log.appendChild(d); log.scrollTop=log.scrollHeight;

}

/* incoming messages */
const liveTr = {};  // sid -> {last, busy}
Net.onMsg = async m=>{
  if(m.type==='tts'){
    const key='peer-'+m.from;
    if(m.on){ Listener.pause(key); clearTimeout(holdTimers.get(m.from)); holdTimers.set(m.from, setTimeout(()=>releaseHold(m.from), 20000)); }
    else releaseHold(m.from);
    return;
  }
  if(m.type==='tr'){
    const b=rbox(m.sid); b.au = !!m.au;
    Object.keys(m.tr||{}).forEach(L=>deliver(m.sid,'tr',L,m.tr[L]));
    // my own sentence translated by the AI phone → show under my bubble
    if(m.sid && m.sid.startsWith(myId+'-')) Object.keys(m.tr||{}).forEach(L=>{ if(m.tr[L]) deliver(m.sid,'mine',L,m.tr[L]); });
    return;
  }
  if(m.type==='audio'){ deliver(m.sid,'audio',m.to, m.b64||null); return; }
  if(S.mode==='solo') return;
  const flag = LANGS[m.lang]?.flag || '';
  if(m.type==='interim'){
    if(m.lang===S.my) return;
    const box=$('sub-main'); box.classList.add('live');
    $('sub-who').textContent = flag+' '+t('partner')+' …';
    $('sub-orig').textContent = m.text;
    const st = liveTr[m.sid] || (liveTr[m.sid]={last:0,busy:false,done:false});
    if(!st.busy && Date.now()-st.last>1100){
      st.busy=true; st.last=Date.now();
      const tr = await translate(m.text, m.lang, S.my, {free:true}); st.busy=false;
      if(tr && !st.done) $('sub-big').textContent = tr + ' …';
    }
    return;
  }
  if(m.type==='final'){
    if(liveTr[m.sid]) liveTr[m.sid].done = true;
    remember(m.text, m.lang);
    hostServe(m.sid, m.text, m.lang);
    if(m.lang===S.my){ addLog('them', m.text, flag); return; }
    $('sub-orig').textContent = m.text;
    if(!liveTr[m.sid] || !$('sub-big').textContent.trim()) $('sub-big').textContent = t('translating');
    let tr = null, relayed = false;
    if(!Api.ready() && hostInRoom()){ tr = await waitRelay(m.sid,'tr',S.my,5000); relayed = !!tr; }
    if(!tr) tr = await translate(m.text, m.lang, S.my);
    const out = tr || m.text;
    const box=$('sub-main'); box.classList.remove('live');
    $('sub-who').textContent = flag+' '+t('partner');
    $('sub-big').textContent = out;
    if(!tr) toast(t('tfail'));
    const logEl = addLog('them', out, flag+' '+m.text, m.lang);
    const audioP = (relayed && rbox(m.sid).au) ? waitRelay(m.sid,'audio',S.my,9000) : undefined;
    if(audioP) logEl._audio = audioP;
    speak(out, S.my, ()=>box.classList.add('tts'), ()=>box.classList.remove('tts'), audioP);
  }
};

$('api-try').onclick = ()=>{ unlockAudio(); speak('您好！欢迎来到我们学校，很高兴见到您。','zh'); setTimeout(()=>speak('안녕하세요! 저희 학교에 오신 것을 환영합니다.','ko'), 300); };
$('api-del').onclick = ()=>{ Api.clear(); $('api-key').value=''; $('api-msg').textContent=''; apiPaint(); Net.send({type:'ping'}); };
$('b-set').onclick = openSheet;
$('b-close').onclick = ()=>$('sheet').classList.remove('on');
$('sheet').onclick = e=>{ if(e.target.id==='sheet') $('sheet').classList.remove('on'); };
$('b-leave').onclick = ()=>{
  $('sheet').classList.remove('on'); Listener.stop(); soloSide=null;
  Net.send({type:'bye'}); setTimeout(()=>Net.close(),200);
  S.mode=null; $('log').innerHTML=''; history.replaceState(null,'',location.pathname);
  show('s-mode');
};

/* --- Keep screen awake --- */
let wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch{} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && (S.mode)) keepAwake(); });

/* --- Init --- */
(function init(){
  const saved = store.get('lang', null);
  if(saved){ S.my = saved; }
  applyLang();
  if(pendingRoom){
    // Came from QR link: highlight join hint
    document.querySelector('#s-lang .sub').innerHTML = '🔗 '+'방 '+pendingRoom+' · 房间 '+pendingRoom+'<br>내가 쓰는 언어를 고르세요 · 请选择您的语言';
  }
})();
</script>
